name: MCP Contract Tests

on:
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - "contracts/**"

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Run contract tests
        run: npx vitest run
