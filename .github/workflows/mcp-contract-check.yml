name: MCP Contract Check

on:
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - "mcpcontracts.json"
      - "mcp.json"
      - "contracts/baseline.mcpc.json"
      - ".github/workflows/mcp-contract-check.yml"

permissions:
  pull-requests: write

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # Zero-config: server, baseline, and fail-on come from mcpcontracts.json
      - name: Check MCP contract
        uses: mcp-contracts/github-action@main
